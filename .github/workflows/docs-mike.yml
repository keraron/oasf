#
# Deploy versioned docs to the gh-pages branch with mike. Version comes from
# docs/mkdocs/mike_versions.ini [versions] release.
#
# GitHub Pages (one-time): Settings → Build and deployment → Source = Deploy from
# a branch → Branch "gh-pages", folder "/ (root)".
#
# To use a custom domain (or keep the canonical URL) set a repository variable
# DOCS_SITE_URL (e.g. https://schema.oasf.outshift.com/). If unset, site_url is
# set to https://<owner>.github.io/<repo>/ for this run only (not committed).

name: Deploy documentation (mike)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-mike.yml'

permissions:
  contents: write

concurrency:
  group: docs-mike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Set site_url for this deployment
        working-directory: docs/mkdocs
        env:
          OVERRIDE_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_SITE_URL}" ]; then
            SITE_URL="${OVERRIDE_SITE_URL}"
          else
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          case "${SITE_URL}" in
            */) ;;
            *) SITE_URL="${SITE_URL}/" ;;
          esac
          echo "Using site_url=${SITE_URL}"
          sed -i "s|^site_url:.*|site_url: ${SITE_URL}|" mkdocs.yml

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        working-directory: docs/mkdocs
        run: |
          set -euo pipefail
          VERSION="$(python3 mike_version.py release)"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
          mike list

      - name: Summarize
        run: |
          if [ -n "${{ vars.DOCS_SITE_URL }}" ]; then
            echo "Published site should use site_url from repository variable DOCS_SITE_URL."
          else
            echo "Default GitHub Pages URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "Add a repository variable DOCS_SITE_URL to pin a custom canonical URL in CI builds."
          fi
          echo "If Pages is not live yet, enable gh-pages in the repository Settings → Pages."
