# OASF docs: taskfile lives in docs/; run from repo root: task docs:build

version: "3"

interval: "500ms"

vars:
  # Parent-include runs with an empty TASKFILE_DIR; resolve from git root instead.
  REPO:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  DOCS: "{{.REPO}}/docs"
  MKDOCS: "{{.REPO}}/docs/mkdocs"
  BUILD_SITE: "{{.REPO}}/.build/site"
  SPELL_CONFIG: "{{.REPO}}/docs/codespellrc"
  MD_CONFIG: "{{.REPO}}/docs/pymarkdown.yaml"
  LYCHEE_CONFIG: "{{.REPO}}/docs/lychee.toml"
  # docs:run uses 8000; keep mike on 8001 unless you override MIKE_SERVE_ADDR on the CLI.
  MIKE_SERVE_ADDR: "127.0.0.1:8001"

tasks:
  default:
    desc: List documentation tasks
    cmds:
      - task --list

  build:
    desc: Build documentation site to .build/site
    cmds:
      - mkdir -p "{{.BUILD_SITE}}"
      - (cd "{{.MKDOCS}}" && mkdocs build -f mkdocs.yml --site-dir "{{.BUILD_SITE}}")
      - 'echo "Docs built: file://{{.BUILD_SITE}}/index.html"'

  run:
    desc: Run mkdocs serve with live reload (http://127.0.0.1:8000)
    cmds:
      - (cd "{{.MKDOCS}}" && mkdocs serve -f mkdocs.yml -a 127.0.0.1:8000)

  test:
    desc: Run all documentation lint checks
    cmds:
      - task: lint

  lint:
    desc: Run spelling, markdown, and link checks
    cmds:
      - task: lint:spelling
      - task: lint:markdown
      - task: lint:links

  lint:spelling:
    desc: Check spelling under docs/
    cmds:
      - codespell --config "{{.SPELL_CONFIG}}" "{{.DOCS}}"

  lint:markdown:
    desc: Check Markdown style under docs/
    cmds:
      - pymarkdown --config "{{.MD_CONFIG}}" scan "{{.DOCS}}"

  lint:links:
    desc: Check links in markdown under docs/ (requires lychee on PATH)
    cmds:
      - lychee --config "{{.LYCHEE_CONFIG}}" "{{.DOCS}}"

  lint:fix:
    desc: Auto-fix spelling and markdown where supported
    cmds:
      - task: lint:fix:spelling
      - task: lint:fix:markdown

  lint:fix:spelling:
    desc: Apply codespell write-fixes to docs/
    cmds:
      - codespell --config "{{.SPELL_CONFIG}}" "{{.DOCS}}" --write-changes

  lint:fix:markdown:
    desc: Apply pymarkdown fixes under docs/
    cmds:
      - pymarkdown --config "{{.MD_CONFIG}}" fix -r "{{.DOCS}}"

  mike:deploy-local:
    desc: >-
      Deploy current docs to local gh-pages with version from mkdocs/mike_versions.ini [versions] local (+ latest alias); no git push
    cmds:
      - 'cd "{{.MKDOCS}}" && test -f mike_version.py || { echo "Missing docs/mkdocs/mike_version.py"; exit 1; }'
      - cd "{{.REPO}}" && git fetch origin gh-pages --depth=1 2>/dev/null || true
      - |
        set -euo pipefail
        cd "{{.MKDOCS}}"
        MIKE_LOCAL="$(python3 mike_version.py local)"
        mike deploy "$MIKE_LOCAL" latest --update-aliases
        mike set-default latest
        mike list
        echo "Local gh-pages updated. Run: task docs:mike:serve  (http://{{.MIKE_SERVE_ADDR}} by default)"

  mike:deploy:
    desc: >-
      Push versioned docs to origin/gh-pages (mike). Set [versions] release in docs/mkdocs/mike_versions.ini or export VERSION=…
    cmds:
      - 'cd "{{.MKDOCS}}" && test -f mike_version.py || { echo "Missing docs/mkdocs/mike_version.py"; exit 1; }'
      - cd "{{.REPO}}" && git fetch origin gh-pages --depth=1 2>/dev/null || true
      - |
        set -euo pipefail
        cd "{{.MKDOCS}}"
        MIKE_VERSION="$(python3 mike_version.py release)"
        mike deploy --push --update-aliases "$MIKE_VERSION" latest
        mike set-default --push latest
        mike list

  mike:serve:
    desc: >-
      Serve versioned site from local gh-pages (run docs:mike:deploy-local first).
      Default http://127.0.0.1:8001 (docs:run uses :8000). Override: task docs:mike:serve MIKE_SERVE_ADDR=127.0.0.1:PORT
    cmds:
      - cd "{{.MKDOCS}}" && mike serve -a "{{.MIKE_SERVE_ADDR}}"
