# OASF documentation (MkDocs Material, AGNTCY theme).
# Build: task docs:build   Serve: task docs:run   (from repository root)

site_name: OASF Documentation
site_url: https://schema.oasf.outshift.com/

docs_dir: ../oasf
site_dir: ../../.build/site

repo_name: agntcy/oasf
repo_url: https://github.com/agntcy/oasf
edit_uri: edit/main/docs/oasf/

extra:
  version:
    provider: mike
    default:
      - latest
  copyright: Copyright &copy; AGNTCY Contributors
  agntcy_docs_url: https://docs.agntcy.org/
  agntcy_docs_label: AGNTCY Documentation

extra_css:
  - stylesheets/agntcy-docs.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - hooks.py

plugins:
  search:
  mike:
    alias_type: redirect
  redirects:
    redirect_maps: {}
  awesome-pages:
    filename: ".index"
    collapse_single_pages: true
    strict: false

theme:
  name: material
  custom_dir: overrides

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/agntcy/favicon.ico
  logo_light: assets/agntcy/img/logo-light.svg
  logo_dark: assets/agntcy/img/logo-dark.svg
